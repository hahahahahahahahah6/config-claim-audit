[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "config-claim-audit"
version = "0.1.0"
description = "Offline audit of documented Python configuration defaults"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "config-claim-audit contributors"}]
dependencies = []

[project.scripts]
config-claim-audit = "config_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
